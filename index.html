<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="준비시간">
<link rel="apple-touch-icon" href="icon.png">
<title>준비 시간 계산기</title>
<style>
  :root {
    --ink: #201d17;
    --sub: #7a7266;
    --paper: #fffdf8;
    --line: #eae3d4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
  }
  body { padding: max(18px, env(safe-area-inset-top)) 0 50px; }
  .wrap { max-width: 440px; margin: 0 auto; padding: 0 20px; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
    min-height: 34px;
  }
  .back-btn {
    border: none;
    background: none;
    font-size: 26px;
    color: var(--ink);
    padding: 0 8px 0 0;
    cursor: pointer;
    visibility: hidden;
  }
  .back-btn.show { visibility: visible; }
  .dots { display: flex; gap: 7px; }
  .dot-step {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--line);
  }
  .dot-step.active { background: var(--ink); width: 20px; border-radius: 5px; }
  .edit-link {
    font-size: 13px;
    color: var(--sub);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px;
  }

  .big-title {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin: 4px 0 6px;
  }
  .big-sub {
    font-size: 14.5px;
    color: var(--sub);
    margin: 0 0 28px;
  }

  .day-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .day-card {
    border: none;
    border-radius: 18px;
    padding: 22px 16px;
    text-align: left;
    font-family: inherit;
    cursor: pointer;
    position: relative;
  }
  .day-card .name { font-size: 22px; font-weight: 800; display: block; }
  .day-card .count { font-size: 12.5px; margin-top: 6px; display: block; opacity: 0.75; font-weight: 600; }

  .choice-stack { display: flex; flex-direction: column; gap: 14px; }
  .choice-card {
    border: none;
    border-radius: 20px;
    padding: 26px 22px;
    text-align: left;
    font-family: inherit;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .choice-card .main { font-size: 21px; font-weight: 800; }
  .choice-card .sub { font-size: 13.5px; margin-top: 5px; font-weight: 600; opacity: 0.8; }
  .choice-card .arrow { font-size: 22px; opacity: 0.5; }

  .result-head {
    font-size: 15px;
    font-weight: 700;
    color: var(--sub);
    margin-bottom: 16px;
  }
  .empty-box {
    border-radius: 20px;
    padding: 40px 20px;
    text-align: center;
    background: #f3efe4;
    color: var(--sub);
    font-size: 15px;
    font-weight: 600;
  }
  .t-block {
    border-radius: 16px;
    padding: 16px 18px;
    margin-bottom: 10px;
  }
  .t-time { font-size: 25px; font-weight: 800; letter-spacing: -0.3px; }
  .t-label { font-size: 13.5px; font-weight: 700; margin-top: 3px; opacity: 0.85; }
  .t-room { font-size: 12px; font-weight: 600; margin-top: 2px; opacity: 0.65; }
  .t-gap {
    text-align: center;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--sub);
    padding: 8px 0;
  }
  .restart-btn {
    width: 100%;
    margin-top: 24px;
    padding: 16px;
    border-radius: 16px;
    border: none;
    background: var(--ink);
    color: white;
    font-size: 15.5px;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
  }

  .edit-day-tabs { display: flex; gap: 6px; margin-bottom: 18px; overflow-x: auto; }
  .edit-day-tab {
    flex-shrink: 0;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: white;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--sub);
    cursor: pointer;
  }
  .edit-day-tab.active { background: var(--ink); color: white; border-color: var(--ink); }
  .class-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 0;
  }
  .class-row input[type="text"], .class-row input[type="time"] {
    font-family: inherit;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    background: white;
    color: var(--ink);
    padding: 9px 10px;
    font-size: 14px;
  }
  .class-row input[type="text"] { flex: 1; min-width: 0; }
  .class-row input[type="time"] { width: 92px; }
  .del-btn {
    width: 34px; height: 34px; flex-shrink: 0;
    border: none;
    background: #f3efe4;
    border-radius: 9px;
    color: var(--sub);
    font-size: 17px;
    cursor: pointer;
  }
  .add-btn {
    width: 100%;
    margin-top: 8px;
    padding: 12px;
    border: 1.5px dashed var(--line);
    background: transparent;
    border-radius: 12px;
    color: var(--sub);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }
  .done-btn {
    width: 100%;
    margin-top: 22px;
    padding: 16px;
    border-radius: 16px;
    border: none;
    background: var(--ink);
    color: white;
    font-size: 15.5px;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
  }
  .today-badge {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 10.5px;
    font-weight: 800;
    background: rgba(255,255,255,0.65);
    padding: 3px 8px;
    border-radius: 999px;
  }
  .quick-links { display: flex; gap: 10px; margin-top: 18px; }
  .quick-link {
    flex: 1;
    padding: 13px 10px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    background: white;
    font-size: 13px;
    font-weight: 700;
    color: var(--sub);
    text-align: center;
    cursor: pointer;
    font-family: inherit;
  }
  .countdown-card {
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 16px;
    background: var(--ink);
    color: white;
  }
  .countdown-card .cd-label { font-size: 12.5px; font-weight: 700; opacity: 0.7; }
  .countdown-card .cd-time { font-size: 27px; font-weight: 800; margin-top: 3px; letter-spacing: -0.4px; }
  .mooc-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 4px;
    border-bottom: 1px solid var(--line);
  }
  .mooc-check {
    width: 24px; height: 24px; flex-shrink: 0;
    border-radius: 7px;
    border: 2px solid var(--line);
    background: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 800; color: white;
    cursor: pointer;
  }
  .mooc-check.done { background: var(--ink); border-color: var(--ink); }
  .mooc-name { flex: 1; font-size: 15px; font-weight: 600; }
  .mooc-name.done { text-decoration: line-through; color: var(--sub); }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <button class="back-btn" id="backBtn">‹</button>
    <div class="dots" id="dots"></div>
    <span style="width:26px;"></span>
  </div>
  <div id="screen"></div>
</div>

<script>
var DAY_KEYS = ['mon','tue','wed','thu','fri','sat','sun'];
var DAY_LABEL = {mon:'월요일',tue:'화요일',wed:'수요일',thu:'목요일',fri:'금요일',sat:'토요일',sun:'일요일'};
var DAY_SHORT = {mon:'월',tue:'화',wed:'수',thu:'목',fri:'금',sat:'토',sun:'일'};
var DAY_COLOR = {
  mon: {bg:'#ffd9d9', ink:'#9c2b2b'},
  tue: {bg:'#ffe3bd', ink:'#a35d0d'},
  wed: {bg:'#d8f2d0', ink:'#357a26'},
  thu: {bg:'#fff2b3', ink:'#8a6a06'},
  fri: {bg:'#d3e8ff', ink:'#1f5aa3'},
  sat: {bg:'#e6d9ff', ink:'#5c34a3'},
  sun: {bg:'#d0f2ea', ink:'#127562'}
};
var CLASS_PALETTE = [
  {bg:'#ffd9d9', ink:'#9c2b2b'}, {bg:'#ffe3bd', ink:'#a35d0d'},
  {bg:'#d8f2d0', ink:'#357a26'}, {bg:'#fff2b3', ink:'#8a6a06'},
  {bg:'#d3e8ff', ink:'#1f5aa3'}, {bg:'#e6d9ff', ink:'#5c34a3'}
];
function classColor(name) {
  var h = 0;
  for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return CLASS_PALETTE[h % CLASS_PALETTE.length];
}
var GETDAY_MAP = ['sun','mon','tue','wed','thu','fri','sat'];
function getTodayKey() { return GETDAY_MAP[new Date().getDay()]; }

var defaultSchedule = {
  mon: [{name:'해킹기초',start:'09:00',end:'10:15',room:'공학7관 7606'},{name:'소프트웨어공학',start:'13:30',end:'14:45',room:'공학7관 7615'},{name:'딥러닝',start:'15:00',end:'16:15',room:'공학7관 7605'}],
  tue: [{name:'AI시대대학생활',start:'11:00',end:'11:50',room:'공학7관 7606'},{name:'유닉스시스템',start:'13:00',end:'14:50',room:'공학7관 7606'}],
  wed: [{name:'해킹기초',start:'10:30',end:'11:45',room:'공학7관 7606'},{name:'딥러닝',start:'13:30',end:'14:45',room:'공학7관 7605'},{name:'소프트웨어공학',start:'15:00',end:'16:15',room:'공학7관 7615'}],
  thu: [{name:'유닉스시스템',start:'13:00',end:'14:50',room:'공학7관 7606'}],
  fri: [], sat: [], sun: []
};
var schedule = null;
try { var s = localStorage.getItem('prepapp2_schedule'); if (s) schedule = JSON.parse(s); } catch (e) {}
if (!schedule) schedule = defaultSchedule;
function saveSchedule() { try { localStorage.setItem('prepapp2_schedule', JSON.stringify(schedule)); } catch (e) {} }

var defaultMooc = [
  { name: '생활 속 인공지능의 이해 및 활용', done: false },
  { name: '소매틱 운동재활', done: false }
];
var mooc = null;
try { var ms = localStorage.getItem('prepapp2_mooc'); if (ms) mooc = JSON.parse(ms); } catch (e) {}
if (!mooc) mooc = defaultMooc;
function saveMooc() { try { localStorage.setItem('prepapp2_mooc', JSON.stringify(mooc)); } catch (e) {} }

// 매주 월요일 기준으로 체크 상태 초기화
function getWeekKey() {
  var d = new Date();
  var day = d.getDay(); // 0=일 ... 1=월
  var diffToMonday = (day === 0) ? 6 : day - 1;
  var monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() - diffToMonday);
  return monday.getFullYear() + '-' + (monday.getMonth() + 1) + '-' + monday.getDate();
}
(function resetMoocWeekly() {
  var currentWeek = getWeekKey();
  var savedWeek = null;
  try { savedWeek = localStorage.getItem('prepapp2_mooc_week'); } catch (e) {}
  if (savedWeek !== currentWeek) {
    mooc.forEach(function (m) { m.done = false; });
    saveMooc();
    try { localStorage.setItem('prepapp2_mooc_week', currentWeek); } catch (e) {}
  }
})();

var transportOpts = { walk: { label: '도보', sub: '30분 전 출발', min: 30 }, car: { label: '차량', sub: '20분 전 출발', min: 20 } };
var makeupOpts = { yes: { label: '화장 함', sub: '3시간 30분 필요', min: 210 }, no: { label: '화장 안 함', sub: '1시간 필요', min: 60 } };

var app = { screen: 'day', day: getTodayKey(), makeup: null, transport: null, editDay: 'mon' };

function toMin(t) { var p = t.split(':'); return Number(p[0]) * 60 + Number(p[1]); }
function fmtTime(min) {
  var m = ((min % 1440) + 1440) % 1440;
  var h = Math.floor(m / 60), mm = m % 60;
  var ampm = h < 12 ? '오전' : '오후';
  var h12 = h % 12; if (h12 === 0) h12 = 12;
  return ampm + ' ' + h12 + ':' + String(mm).padStart(2, '0');
}
function fmtDur(min) {
  var h = Math.floor(min / 60), m = min % 60;
  if (h && m) return h + '시간 ' + m + '분';
  if (h) return h + '시간';
  return m + '분';
}

function goTo(screen) { app.screen = screen; render(); window.scrollTo(0,0); }

function renderDots(step) {
  var html = '';
  for (var i = 0; i < 3; i++) html += '<div class="dot-step' + (i === step ? ' active' : '') + '"></div>';
  return html;
}

function render() {
  var backBtn = document.getElementById('backBtn');
  var dots = document.getElementById('dots');
  var s = document.getElementById('screen');

  backBtn.classList.toggle('show', app.screen !== 'day' && app.screen !== 'edit' && app.screen !== 'mooc');

  if (app.screen === 'day') {
    dots.innerHTML = renderDots(0);
    var todayKey = getTodayKey();
    var grid = DAY_KEYS.map(function (k) {
      var c = DAY_COLOR[k];
      var n = schedule[k].length;
      return '<button class="day-card" data-day="' + k + '" style="background:' + c.bg + ';color:' + c.ink + ';">'
        + (k === todayKey ? '<span class="today-badge" style="color:' + c.ink + ';">오늘</span>' : '')
        + '<span class="name">' + DAY_LABEL[k] + '</span>'
        + '<span class="count">' + (n === 0 ? '수업 없음' : '수업 ' + n + '개') + '</span>'
        + '</button>';
    }).join('');
    var moocLeft = mooc.filter(function (m) { return !m.done; }).length;
    s.innerHTML = '<div class="big-title">무슨 요일이에요?</div>'
      + '<div class="big-sub">그날 시간표를 기준으로 계산할게요.</div>'
      + '<div class="day-grid">' + grid + '</div>'
      + '<div class="quick-links">'
      + '<button class="quick-link" id="goEdit">수업 편집</button>'
      + '<button class="quick-link" id="goMooc">온라인 강좌 (' + moocLeft + ')</button>'
      + '</div>';
    s.querySelectorAll('[data-day]').forEach(function (btn) {
      btn.onclick = function () { app.day = btn.getAttribute('data-day'); goTo('makeup'); };
    });
    document.getElementById('goEdit').onclick = function () { goTo('edit'); };
    document.getElementById('goMooc').onclick = function () { goTo('mooc'); };
  }

  else if (app.screen === 'makeup') {
    dots.innerHTML = renderDots(1);
    var cards = Object.keys(makeupOpts).map(function (k) {
      var o = makeupOpts[k];
      return '<button class="choice-card" data-val="' + k + '" style="background:#fff2b3;color:#5c4406;">'
        + '<div><div class="main">' + o.label + '</div><div class="sub">' + o.sub + '</div></div>'
        + '<div class="arrow">›</div></button>';
    }).join('');
    s.innerHTML = '<div class="big-title">화장, 하실 거예요?</div>'
      + '<div class="big-sub">' + DAY_LABEL[app.day] + ' 기준으로 준비 시간을 계산해요.</div>'
      + '<div class="choice-stack">' + cards + '</div>';
    s.querySelectorAll('[data-val]').forEach(function (btn) {
      btn.onclick = function () { app.makeup = btn.getAttribute('data-val'); goTo('transport'); };
    });
  }

  else if (app.screen === 'transport') {
    dots.innerHTML = renderDots(2);
    var cards2 = Object.keys(transportOpts).map(function (k) {
      var o = transportOpts[k];
      return '<button class="choice-card" data-val="' + k + '" style="background:#d3e8ff;color:#1f5aa3;">'
        + '<div><div class="main">' + o.label + '</div><div class="sub">' + o.sub + '</div></div>'
        + '<div class="arrow">›</div></button>';
    }).join('');
    s.innerHTML = '<div class="big-title">어떻게 이동해요?</div>'
      + '<div class="big-sub">이동 방법에 따라 출발 시간이 달라져요.</div>'
      + '<div class="choice-stack">' + cards2 + '</div>';
    s.querySelectorAll('[data-val]').forEach(function (btn) {
      btn.onclick = function () { app.transport = btn.getAttribute('data-val'); goTo('result'); };
    });
  }

  else if (app.screen === 'result') {
    dots.innerHTML = '';
    var classes = schedule[app.day].slice().sort(function (a, b) { return toMin(a.start) - toMin(b.start); });
    var valid = classes.filter(function (c) { return toMin(c.end) > toMin(c.start); });

    var countdownHtml = '';
    if (app.day === getTodayKey() && valid.length > 0) {
      var now = new Date();
      var nowMin = now.getHours() * 60 + now.getMinutes();
      var ongoing = valid.find(function (c) { return toMin(c.start) <= nowMin && nowMin < toMin(c.end); });
      var next = valid.find(function (c) { return toMin(c.start) > nowMin; });
      if (ongoing) {
        countdownHtml = '<div class="countdown-card"><div class="cd-label">지금 수업 중 · ' + ongoing.name + (ongoing.room ? ' · ' + ongoing.room : '') + '</div><div class="cd-time">' + fmtDur(toMin(ongoing.end) - nowMin) + ' 후 종료</div></div>';
      } else if (next) {
        countdownHtml = '<div class="countdown-card"><div class="cd-label">다음 수업 · ' + next.name + (next.room ? ' · ' + next.room : '') + '</div><div class="cd-time">' + fmtDur(toMin(next.start) - nowMin) + ' 남음</div></div>';
      } else {
        countdownHtml = '<div class="countdown-card"><div class="cd-label">오늘 일정</div><div class="cd-time">수업 다 끝났어요</div></div>';
      }
    }

    var body;
    if (valid.length === 0) {
      body = '<div class="empty-box">' + DAY_LABEL[app.day] + '은 등록된 수업이 없어요.</div>';
    } else {
      var first = valid[0];
      var tMin = transportOpts[app.transport].min;
      var mMin = makeupOpts[app.makeup].min;
      var departMin = toMin(first.start) - tMin;
      var prepStartMin = departMin - mMin;

      var blocks = [];
      blocks.push('<div class="t-block" style="background:#f3efe4;color:#3a352a;"><div class="t-time">' + fmtTime(prepStartMin) + '</div><div class="t-label">준비 시작 · ' + makeupOpts[app.makeup].label + '</div></div>');
      blocks.push('<div class="t-block" style="background:#f3efe4;color:#3a352a;"><div class="t-time">' + fmtTime(departMin) + '</div><div class="t-label">집에서 출발 · ' + transportOpts[app.transport].label + '</div></div>');
      valid.forEach(function (c, i) {
        if (i > 0) {
          var gap = toMin(c.start) - toMin(valid[i - 1].end);
          if (gap > 0) blocks.push('<div class="t-gap">쉬는 시간 ' + fmtDur(gap) + '</div>');
        }
        var col = classColor(c.name);
        blocks.push('<div class="t-block" style="background:' + col.bg + ';color:' + col.ink + ';"><div class="t-time">' + fmtTime(toMin(c.start)) + ' – ' + fmtTime(toMin(c.end)) + '</div><div class="t-label">' + c.name + '</div>' + (c.room ? '<div class="t-room">' + c.room + '</div>' : '') + '</div>');
      });
      body = '<div class="result-head">' + DAY_LABEL[app.day] + ' 일정</div>' + blocks.join('');
    }

    s.innerHTML = countdownHtml + body + '<button class="restart-btn" id="restartBtn">처음부터 다시</button>';
    document.getElementById('restartBtn').onclick = function () {
      app.day = null; app.makeup = null; app.transport = null; goTo('day');
    };
  }

  else if (app.screen === 'edit') {
    dots.innerHTML = '';
    var tabs = DAY_KEYS.map(function (k) {
      return '<button class="edit-day-tab' + (app.editDay === k ? ' active' : '') + '" data-day="' + k + '">' + DAY_SHORT[k] + '</button>';
    }).join('');
    var list = schedule[app.editDay].map(function (c, i) {
      var bad = toMin(c.end) <= toMin(c.start);
      return '<div style="border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px;">'
        + '<div class="class-row">'
        + '<input type="text" value="' + c.name.replace(/"/g, '&quot;') + '" data-idx="' + i + '" data-field="name">'
        + '<input type="time" value="' + c.start + '" data-idx="' + i + '" data-field="start">'
        + '<span style="color:var(--sub);font-size:12px;">–</span>'
        + '<input type="time" value="' + c.end + '" data-idx="' + i + '" data-field="end">'
        + '<button class="del-btn" data-del="' + i + '">×</button>'
        + '</div>'
        + '<div class="class-row" style="padding-top:0;">'
        + '<input type="text" value="' + (c.room || '').replace(/"/g, '&quot;') + '" placeholder="강의실 (예: 공학7관 7606)" data-idx="' + i + '" data-field="room" style="flex:1;">'
        + '</div>'
        + (bad ? '<div style="font-size:12px;color:#c2410c;margin:2px 0 0;">종료 시간이 시작보다 빨라요</div>' : '')
        + '</div>';
    }).join('');
    s.innerHTML = '<div class="big-title">수업 편집</div>'
      + '<div class="big-sub">요일을 고르고 수업을 추가하거나 고쳐보세요.</div>'
      + '<div class="edit-day-tabs">' + tabs + '</div>'
      + '<div id="editList">' + list + '</div>'
      + '<button class="add-btn" id="addClass">+ 수업 추가</button>'
      + '<button class="done-btn" id="doneEdit">완료</button>';

    s.querySelectorAll('[data-day]').forEach(function (btn) {
      btn.onclick = function () { app.editDay = btn.getAttribute('data-day'); render(); };
    });
    document.getElementById('addClass').onclick = function () {
      schedule[app.editDay].push({ name: '새 수업', start: '09:00', end: '10:00', room: '' });
      saveSchedule(); render();
    };
    s.querySelectorAll('[data-del]').forEach(function (btn) {
      btn.onclick = function () {
        schedule[app.editDay].splice(Number(btn.getAttribute('data-del')), 1);
        saveSchedule(); render();
      };
    });
    s.querySelectorAll('[data-field]').forEach(function (inp) {
      inp.onchange = function () {
        var idx = Number(inp.getAttribute('data-idx'));
        schedule[app.editDay][idx][inp.getAttribute('data-field')] = inp.value;
        saveSchedule(); render();
      };
    });
    document.getElementById('doneEdit').onclick = function () { goTo('day'); };
  }

  else if (app.screen === 'mooc') {
    dots.innerHTML = '';
    var moocList = mooc.map(function (m, i) {
      return '<div class="mooc-row">'
        + '<button class="mooc-check' + (m.done ? ' done' : '') + '" data-toggle="' + i + '">' + (m.done ? '✓' : '') + '</button>'
        + '<div class="mooc-name' + (m.done ? ' done' : '') + '">' + m.name + '</div>'
        + '<button class="del-btn" data-delmooc="' + i + '">×</button>'
        + '</div>';
    }).join('');
    s.innerHTML = '<div class="big-title">온라인 강좌</div>'
      + '<div class="big-sub">요일 상관없이 들어야 하는 K-MOOC 강좌예요. 체크는 매주 월요일에 초기화돼요.</div>'
      + '<div id="moocList">' + moocList + '</div>'
      + '<button class="add-btn" id="addMooc">+ 강좌 추가</button>'
      + '<button class="done-btn" id="doneMooc">완료</button>';

    s.querySelectorAll('[data-toggle]').forEach(function (btn) {
      btn.onclick = function () {
        var idx = Number(btn.getAttribute('data-toggle'));
        mooc[idx].done = !mooc[idx].done;
        saveMooc(); render();
      };
    });
    s.querySelectorAll('[data-delmooc]').forEach(function (btn) {
      btn.onclick = function () {
        mooc.splice(Number(btn.getAttribute('data-delmooc')), 1);
        saveMooc(); render();
      };
    });
    document.getElementById('addMooc').onclick = function () {
      var name = prompt('강좌 이름을 입력하세요');
      if (name) { mooc.push({ name: name, done: false }); saveMooc(); render(); }
    };
    document.getElementById('doneMooc').onclick = function () { goTo('day'); };
  }
}

document.getElementById('backBtn').onclick = function () {
  if (app.screen === 'makeup') goTo('day');
  else if (app.screen === 'transport') goTo('makeup');
  else if (app.screen === 'result') goTo('transport');
};

render();
setInterval(function () { if (app.screen === 'result') render(); }, 30000);
</script>
</body>
</html>
